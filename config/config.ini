; Non-secret settings. Credentials and email addresses stay in .env.
; Write values without quotes; configparser keeps quotes as part of the value.
[browser]
headless=false
slow_mo=300

[url]
base_url = https://www.saucedemo.com
inventory_path = /inventory.html
practice_url = https://practice-automation.com
popups_path = /popups/
window_operations_path = /window-operations/
iframe_path = /iframe/

[credentials]
app_username = standard_user
locked_username = locked_out_user
password = secret_sauce
wrong_password = wrong_password

[api]
base_url = https://rahulshettyacademy.com

[messages]
login_error = Epic sadface: Username and password do not match any user in this service
locked_user_error = Epic sadface: Sorry, this user has been locked out.
home_page_heading = Products
api_login_success = Login Successfully
api_order_placed = Order Placed Successfully
api_product_added = Product Added Successfully
api_product_deleted = Product Deleted Successfully

[email]
enabled = true
smtp_host = smtp.gmail.com
smtp_port = 587

[report]
logo = assets/logo.svg
tab_title = Test Report