[pytest]
markers =
    smoke: Smoke tests
    regression: Regression tests
    negative: Negative test scenarios
    blocker: Blocker test scenario
    critical: Critical test scenario
    major: Major test scenario
    minor: Minor test scenario
    trivial: Trivial test scenario
    ui: UI tests
    api: API tests
    dialog: Dialog tests
    windows: new tab/windows tests
    e2e: End-to-end tests
    description(text): One-line description of what the test verifies
    skip_teardown: keep data created by the test (no cleanup)

# Fail on misspelled or unregistered markers instead of only warning.
# --html is required to switch pytest-html on; fixtures/logging_fixture.py moves the report
# to reports/<timestamp>/html/report<timestamp>.html for every run.
addopts = --strict-markers --html=reports/report.html --self-contained-html --css=assets/report.css

# -------------------------
# Console logging (shown live while tests run)
# -------------------------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-5s | %(message)s
log_cli_date_format = %H:%M:%S

# -------------------------
# File logging (fixtures/logging_fixture.py moves each run's log to
# reports/<timestamp>/log/test_run<timestamp>.log; log_file below is only the default)
# -------------------------
log_file = reports/logs/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-5s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S